name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Compiles all modules, generates protobuf/gRPC code, runs unit tests and
      # simulated-network Raft tests (once they exist).
      - name: Build and test
        run: ./gradlew build --console=plain

      # 50 seeded chaos runs on the simulated cluster, each checked for linearizability.
      # Fails the build on any NOT_LINEARIZABLE or INCONCLUSIVE run.
      - name: Chaos (50 seeds)
        run: ./gradlew chaos -Pruns=50 -Plabel=ci --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            reports/chaos/chaos-ci-*
